name: Build & Deploy Docker Image (Bot)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'qa'
        type: choice
        options:
#          - prod
          - qa
#          - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Params
        run: |
          echo "------DOCKER-------"
          echo "DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}"
          echo "DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}"
          echo "------SERVER-------"
          echo "SSH_HOST_QA: ${{ vars.SSH_HOST_QA }}"
          echo "SSH_USER_QA: ${{ secrets.SSH_USER_QA }}"
          echo "SSH_KEY_QA: ${{ secrets.SSH_KEY_QA }}"
          echo "SSH_PORT_QA: ${{ secrets.SSH_PORT_QA }}"
          echo "-------BOT--------"
          echo "BOT_API_TOKEN_QA: ${{ secrets.BOT_API_TOKEN_QA }}"
          echo "EXTERNAL_API_URL_QA: ${{ vars.EXTERNAL_API_URL_QA }}"
          echo "EXTERNAL_API_CHECK_ACCESS_QA: ${{ vars.EXTERNAL_API_CHECK_ACCESS_QA }}"
  

      - name: Build & Push Docker Image App
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: verixas/orders-bot-app
          dockerfile: ./Dockerfile.app
          tags: latest
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image Bot
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: verixas/orders-bot
          dockerfile: ./Dockerfile.bot
          tags: latest
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Deploy to QA
        if: "${{ inputs.environment == 'qa' }}"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_HOST_QA }}
          username: ${{ secrets.SSH_USER_QA }}
          key: ${{ secrets.SSH_KEY_QA }}
          port: ${{ secrets.SSH_PORT_QA }}
          script: |
            docker stop orders-bot-app orders-bot || true
            docker rm orders-bot-app orders-bot || true
            
            docker pull verixas/orders-bot-app:latest
            docker pull verixas/orders-bot:latest
  
            docker network rm orders-bot-network || true
            docker network create orders-bot-network
  
            docker run -dit -p 8000:8000 \
              -e "BOT_API_TOKEN=${{ secrets.BOT_API_TOKEN_QA }}" \
              -e "EXTERNAL_API_URL=${{ vars.EXTERNAL_API_URL_QA }}" \
              -e "EXTERNAL_API_CHECK_ACCESS=${{ vars.EXTERNAL_API_CHECK_ACCESS_QA }}" \
              --add-host=host.docker.internal:host-gateway \
              --network orders-bot-network \
              --name orders-bot-app verixas/orders-bot-app:latest
            
            docker run -dit -p 8080:8080 \
              -e "BOT_API_TOKEN=${{ secrets.BOT_API_TOKEN_QA }}" \
              -e "EXTERNAL_API_URL=${{ vars.EXTERNAL_API_URL_QA }}" \
              -e "EXTERNAL_API_CHECK_ACCESS=${{ vars.EXTERNAL_API_CHECK_ACCESS_QA }}" \
              --add-host=host.docker.internal:host-gateway \
              --network orders-bot-network \
              --name orders-bot verixas/orders-bot:latest
            
            docker ps